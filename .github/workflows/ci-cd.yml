name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          JWT_SECRET: ci-test-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Rollup's platform-specific optional dependency doesn't resolve
      # correctly from a package-lock.json generated on a different OS
      # (npm/cli#4828) - the lockfile here was generated on Windows, this
      # runner is Linux. Deleting it forces a truly fresh resolution.
      - name: Fresh install (works around npm/cli#4828)
        run: rm -rf node_modules package-lock.json && npm install
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=catan-c9v

  deploy-backend:
    needs: backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, catan-laptop]
    steps:
      - uses: actions/checkout@v4
      # The runner service doesn't inherit the interactive user's PATH, so
      # docker.exe (installed under the user's own AppData by Docker
      # Desktop) isn't found by default. Extend PATH for the rest of this
      # job via GITHUB_PATH, the supported mechanism for this.
      - name: Add Docker to PATH
        shell: cmd
        run: echo C:\Users\yasht\AppData\Local\Programs\DockerDesktop\resources\bin>> %GITHUB_PATH%
      - name: Write production .env
        # cmd, not powershell: a fresh Windows machine's default execution
        # policy blocks running the temp .ps1 script Actions generates for
        # `shell: powershell` steps ("running scripts is disabled on this
        # system"). cmd has no such restriction and these steps are simple
        # enough not to need PowerShell.
        shell: cmd
        run: |
          echo DATABASE_URL=postgresql://catan:catan@postgres:5432/catan> .env
          echo JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}>> .env
      - name: Restart backend stack
        shell: cmd
        run: docker compose -p catan-prod up -d --build postgres backend
