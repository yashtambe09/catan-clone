name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          JWT_SECRET: ci-test-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Rollup's platform-specific optional dependency doesn't resolve
      # correctly from a package-lock.json generated on a different OS
      # (npm/cli#4828) - the lockfile here was generated on Windows, this
      # runner is Linux. Deleting it forces a truly fresh resolution.
      - name: Fresh install (works around npm/cli#4828)
        run: rm -rf node_modules package-lock.json && npm install
      - run: npm run build
        env:
          # Without this, config.js's fallback computes
          # http://catan.mightycaptions.in:8000 for the deployed frontend -
          # wrong host, port, and protocol. Vite bakes env vars in at build
          # time, so this has to be set here, not at runtime.
          VITE_BACKEND_URL: https://api.catan.mightycaptions.in
      - name: Deploy to Cloudflare Pages
        # Project *name* (catan) and its public pages.dev subdomain
        # (catan-c9v.pages.dev, auto-suffixed because the bare "catan"
        # subdomain wasn't available) are independent in Cloudflare Pages -
        # confirmed via the dashboard's own URL (/pages/view/catan) and
        # breadcrumb ("Workers & Pages > catan"), after catan-c9v as the
        # --project-name kept failing with "Project not found".
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=catan

  deploy-backend:
    needs: backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, catan-laptop]
    steps:
      - uses: actions/checkout@v4
      - name: Write production .env
        # cmd, not powershell: a fresh Windows machine's default execution
        # policy blocks running the temp .ps1 script Actions generates for
        # `shell: powershell` steps ("running scripts is disabled on this
        # system"). cmd has no such restriction and these steps are simple
        # enough not to need PowerShell.
        shell: cmd
        run: |
          echo DATABASE_URL=postgresql://catan:catan@postgres:5432/catan> .env
          echo JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}>> .env
          echo POSTGRES_PORT=5433>> .env
          echo BACKEND_PORT=8001>> .env
      - name: Restart backend stack
        # Full path, not a bare `docker` - the runner service's environment
        # doesn't include the interactive user's PATH (where Docker Desktop
        # added its own bin folder), so a plain `docker` isn't found.
        shell: cmd
        run: '"C:\Users\yasht\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" compose -p catan-prod up -d --build postgres backend'
