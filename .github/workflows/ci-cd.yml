name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          JWT_SECRET: ci-test-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=catan

  deploy-backend:
    needs: backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, catan-laptop]
    steps:
      - uses: actions/checkout@v4
      - name: Write production .env
        shell: pwsh
        run: |
          Set-Content -Path .env -Value "DATABASE_URL=postgresql://catan:catan@postgres:5432/catan"
          Add-Content -Path .env -Value "JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}"
      - name: Restart backend stack
        shell: pwsh
        run: docker compose -p catan-prod up -d --build postgres backend
