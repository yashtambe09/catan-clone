      <svg width="34" height="34" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="8" fill="#fdf8ee" stroke="oklch(70% 0.03 70)" stroke-width="1.5"/><circle cx="11" cy="11" r="3.2" fill="oklch(25% 0.02 60)"/><circle cx="29" cy="11" r="3.2" fill="oklch(25% 0.02 60)"/><circle cx="20" cy="20" r="3.2" fill="oklch(25% 0.02 60)"/><circle cx="11" cy="29" r="3.2" fill="oklch(25% 0.02 60)"/><circle cx="29" cy="29" r="3.2" fill="oklch(25% 0.02 60)"/></svg>

          <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:oklch(45% 0.02 60);"><span style="width:9px;height:9px;border-radius:50%;background:oklch(75% 0.13 85);display:inline-block;"></span>1</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:oklch(45% 0.02 60);"><span style="width:9px;height:9px;border-radius:50%;background:oklch(70% 0.10 140);display:inline-block;"></span>1</span>
        </div>

      <div style="display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:8px;border:1px solid oklch(85% 0.03 70);background:oklch(99% 0.008 85);">
        <span style="font-weight:700;font-size:14px;color:oklch(25% 0.02 60);">City</span>

          <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:oklch(45% 0.02 60);"><span style="width:9px;height:9px;border-radius:50%;background:oklch(55% 0.02 250);display:inline-block;"></span>3</span>

      <div style="display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:8px;border:1px solid oklch(85% 0.03 70);background:oklch(99% 0.008 85);">
        <span style="font-weight:700;font-size:14px;color:oklch(25% 0.02 60);">Dev Card</span>
        <div style="display:flex;gap:6px;">
          <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:oklch(45% 0.02 60);"><span style="width:9px;height:9px;border-radius:50%;background:oklch(75% 0.13 85);display:inline-block;"></span>1</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:oklch(45% 0.02 60);"><span style="width:9px;height:9px;border-radius:50%;background:oklch(70% 0.10 140);display:inline-block;"></span>1</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:12px;color:oklch(45% 0.02 60);"><span style="width:9px;height:9px;border-radius:50%;background:oklch(55% 0.02 250);display:inline-block;"></span>1</span>

      <button style="margin-top:4px;width:100%;padding:12px;border-radius:8px;border:2px solid oklch(52% 0.16 35);background:transparent;color:oklch(52% 0.16 35);font-weight:700;font-size:14px;font-family:'Karla',sans-serif;cursor:pointer;">Propose Trade</button>

  </div>

</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const r = 36;
    const colors = {
      wood:   { fill: 'oklch(42% 0.06 150)', text: '#f5efe0' },
      wheat:  { fill: 'oklch(75% 0.13 85)',  text: '#3a2a12' },
      sheep:  { fill: 'oklch(70% 0.10 140)', text: '#1f3a1a' },
      brick:  { fill: 'oklch(52% 0.16 35)',  text: '#f5efe0' },
      ore:    { fill: 'oklch(55% 0.02 250)', text: '#f5efe0' },
      desert: { fill: 'oklch(85% 0.05 85)',  text: '#5c4a2e' },
    };
    const rows = [
      [['wood', 5], ['sheep', 2], ['wheat', 6]],
      [['brick', 3], ['ore', 8], ['wood', 10], ['wheat', 9]],
      [['sheep', 11], ['brick', 4], ['desert', null], ['wood', 8], ['ore', 11]],
      [['wheat', 5], ['sheep', 9], ['brick', 10], ['wood', 4]],
      [['sheep', 3], ['wheat', 6], ['ore', 12]],
    ];
    const colSpacing = Math.sqrt(3) * r;
    const rowSpacing = 1.5 * r;
    const dx = colSpacing / 2;
    const cx0 = 280;
    const cy0 = 260;

    const hexPoints = (cx, cy) => [
      [0, -r], [dx, -r / 2], [dx, r / 2], [0, r], [-dx, r / 2], [-dx, -r / 2],
    ].map(([px, py]) => `${cx + px},${cy + py}`).join(' ');

    const hexes = [];
    rows.forEach((row, ri) => {
      const n = row.length;
      const y = cy0 + (ri - 2) * rowSpacing;
      const startX = cx0 - ((n - 1) / 2) * colSpacing;
      row.forEach(([terrain, number], ci) => {
        const x = startX + ci * colSpacing;
        const c = colors[terrain];
        const isHot = number === 6 || number === 8;
        hexes.push({
          points: hexPoints(x, y),
          fill: c.fill,
          textColor: c.text,
          cx: x,
          cy: y,
          labelY: y - 20,
          robberX: x - 3,
          robberY: y - 12,
          number: number,
          numberColor: isHot ? 'oklch(52% 0.16 35)' : 'oklch(25% 0.02 60)',
          numberWeight: isHot ? '800' : '600',
          isDesert: terrain === 'desert',
          terrainLabel: terrain.charAt(0).toUpperCase() + terrain.slice(1),
        });
      });
    });
    return { hexes };
  }
}
</script>
</body>
</html>
