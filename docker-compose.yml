services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catan
      POSTGRES_PASSWORD: catan
      POSTGRES_DB: catan
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catan -d catan"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://catan:catan@postgres:5432/catan
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
    depends_on:
      postgres:
        # Plain `depends_on: [postgres]` only waits for the container to
        # start, not for Postgres to actually be ready to accept
        # connections - on a cold start (empty pgdata volume, running
        # first-time migrations) that race lost outright: the backend's
        # asyncpg pool failed on lifespan startup with a bare
        # ConnectionRefusedError, and with no restart policy the container
        # was left "running" with nothing actually listening on 8000.
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # No VITE_BACKEND_URL set here on purpose: frontend/src/config.js falls
    # back to window.location.hostname, so this works unmodified whether the
    # page is loaded via localhost or a LAN IP (needed for LAN playtesting).
    # Set VITE_BACKEND_URL explicitly only to force a different backend host.
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  pgdata:
