services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catan
      POSTGRES_PASSWORD: catan
      POSTGRES_DB: catan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://catan:catan@postgres:5432/catan
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # No VITE_BACKEND_URL set here on purpose: frontend/src/config.js falls
    # back to window.location.hostname, so this works unmodified whether the
    # page is loaded via localhost or a LAN IP (needed for LAN playtesting).
    # Set VITE_BACKEND_URL explicitly only to force a different backend host.
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  pgdata:
